<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="img">
        <div class="hover">
          <img
            class="image"
            src="images/image-equilibrium.jpg"
            alt="image-equilibrium"
          />
        </div>
      </div>
      <div class="content">
        <h2>Equilibrium #3429</h2>
        <p class="description">
          Our Equilibrium collection promotes balance and calm.
        </p>
        <div class="father">
          <div class="etl">
            <img
              class="etl_i"
              src="images/icon-ethereum.svg"
              alt="icon-ethereum"
            />
            <p class="etl_p">0.041 ETH</p>
          </div>
          <div class="date">
            <img class="date_i" src="images/icon-clock.svg" alt="icon-clock" />
            <p class="date_p">3 days left</p>
          </div>
        </div>
      </div>
      <div class="footer">
        <img class="avatar" src="images/image-avatar.png" alt="" />

        <p class="creator">Creation of</p>
        <p class="d">Jules Wyvern</p>
      </div>
    </main>
  </body>
</html>
